[package]
name = "vouchify"
version = "0.3.10"
description = "Vouchify — Voucher & Settlement Calculation App"
authors = ["you"]
edition = "2021"

[lib]
name = "vouchify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.82"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
quick-xml = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
