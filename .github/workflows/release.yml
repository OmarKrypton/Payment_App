name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 25
        run: |
          # The azure.archive.ubuntu.com mirror on GH runners frequently stalls
          # on large downloads (libwebkit2gtk). Force the main archive mirror
          # which is far more reliable, then install with retries + timeouts.
          export DEBIAN_FRONTEND=noninteractive
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i 's|security.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i 's|security.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          APT="apt-get -o Acquire::Retries=10 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -o Acquire::ftp::Timeout=60 -o Acquire::http::Pipeline-Depth=0"
          sudo $APT update
          for i in 1 2 3; do
            timeout 600 sudo $APT install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev \
              libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libfuse2 rpm && break
            echo "apt install attempt $i failed, retrying in 10s..." >&2
            sleep 10
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - run: npm ci

      # Populate the tools that ship inside the Windows installer so users do
      # not need to install Poppler/Tesseract themselves. The app discovers
      # these under <resource_dir>/bundled/win (see src-tauri/tauri.windows.conf.json).
      - name: Bundle PDF/OCR tools (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/bundled/win"
          New-Item -ItemType Directory -Force -Path "$dest/poppler" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest/tesseract" | Out-Null

          Write-Host "== Poppler (pdftotext, pdftoppm) =="
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "vouchify-build" }
          $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "Release-*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No Poppler release zip found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive poppler.zip -DestinationPath poppler_tmp -Force
          $bin = Get-ChildItem poppler_tmp -Recurse -Directory -Filter bin |
            Where-Object { $_.Parent.Name -eq "Library" } | Select-Object -First 1
          if (-not $bin) { $bin = Get-ChildItem poppler_tmp -Recurse -Directory -Filter bin | Select-Object -First 1 }
          if (-not $bin) { throw "Poppler bin folder not found" }
          Copy-Item "$($bin.Parent.FullName)\*" "$dest/poppler" -Recurse -Force
          try {
            $copying = Get-ChildItem poppler_tmp -Recurse -Filter COPYING | Select-Object -First 1
            if ($copying) { Copy-Item $copying.FullName "$dest/poppler/COPYING.txt" -Force }
          } catch {}

          Write-Host "== Tesseract =="
          choco install tesseract --no-progress -y
          $tess = Get-ChildItem "C:\Program Files" -Recurse -Filter tesseract.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tess) { throw "tesseract.exe not found after install" }
          $tessDir = $tess.DirectoryName
          Copy-Item "$tessDir\*" "$dest/tesseract" -Recurse -Force

          Write-Host "== Tesseract language data (OCR uses chi_sim+eng) =="
          $td = "$dest/tesseract/tessdata"
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          foreach ($lang in @("chi_sim")) {
            $out = "$td/$lang.traineddata"
            if (-not (Test-Path $out)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $out
            }
          }

          Write-Host "== Result =="
          $sum = (Get-ChildItem -Recurse "$dest" -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("bundled size: {0:N1} MB" -f ($sum / 1MB))
          Get-ChildItem "$dest" | Select-Object Name

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "1"
        with:
          tagName: v__VERSION__
          releaseName: "Vouchify v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Upload native Linux binary to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="v'"$VERSION"'") | .id' | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "release for v${VERSION} not found" >&2
            exit 1
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=vouchify-linux-x86_64" \
            --input src-tauri/target/release/vouchify > /dev/null


